const RITUAL=[["2026-10-10","মহালয়া"],["2026-10-11","প্রতিপদা"],["2026-10-12","দ্বিতীয়া"],["2026-10-13","তৃতীয়া"],["2026-10-14","চতুর্থী দ্বিতীয়া"],["2026-10-15","পঞ্চমী"],["2026-10-16","ষষ্ঠী"],["2026-10-17","সপ্তমী"],["2026-10-18","সপ্তমী"],["2026-10-19","অষ্টমী"],["2026-10-20","নবমী"],["2026-10-21","দশমী"]];function clockTick(){ const c=document.getElementById('clock'); if(!c)return; const d=new Date(); const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); const r=RITUAL.find(x=>x[0]===key); c.innerHTML='<b>'+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</b>'+'<span>'+d.toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'})+'</span>'+(r?'<em>আজ '+r[1]+'</em>':'');}clockTick();setInterval(clockTick,1000);
const SEL="pujaSelectedV1",DONE="pujaDoneV1";
const LS={g:(k,d)=>{try{const v=localStorage.getItem(k);if(v==null)return d;const p=JSON.parse(v);return Array.isArray(p)?p:d}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let sel=new Set(LS.g(SEL,[]).filter(n=>DATA.some(d=>d.n===n)));
const h=new URLSearchParams(location.hash.slice(1));
if(!sel.size&&h.get("s"))sel=new Set(h.get("s").split("|").filter(Boolean).filter(n=>DATA.some(d=>d.n===n)));
let done=new Set(LS.g(DONE,[]).filter(n=>DATA.some(d=>d.n===n)));
let cat="",hideDone=false;
let mine=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save=()=>LS.s(DONE,[...done]);
const CM=[["#fde7ef","#a3125a"],["#ede4fb","#5b21b6"],["#fdf3d7","#8a6100"],["#dcf1f2","#00696f"],["#efe6e2","#6d4c41"]];
const ICONS=["🌺","🌸","🪔","🪷","🌉"];

const chips=document.getElementById("chips");
chips.innerHTML='<button class="chip'+(cat===""?" on":"")+'" data-c="">All</button>'+
 CATS.map((c,i)=>'<button class="chip" data-c="'+esc(c.k)+'">'+ICONS[i]+' '+esc(c.n)+'</button>').join("")+
 '<button class="chip" id="hd">Hide done</button>';
chips.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;
 if(b.id==="hd"){hideDone=!hideDone;b.classList.toggle("on",hideDone)}
 else{cat=b.dataset.c;[...chips.querySelectorAll(".chip:not(#hd)")].forEach(x=>x.classList.toggle("on",x===b))}
 render()};

function render(){
  mine=DATA.filter(d=>sel.has(d.n));
  const total=mine.length;
  const hit=mine.filter(d=>done.has(d.n)).length;
  const pct=total?Math.round(hit*100/total):0;
  document.getElementById("pct").textContent=pct+"%";
document.getElementById("sub").textContent=hit+" of "+total+" done";
  document.getElementById("seg").innerHTML=mine.map(d=>'<i class="'+(done.has(d.n)?"f":"")+'"></i>').join("");
  document.getElementById("reset").style.display=hit?"":"none";
  const view=document.getElementById("view");
  view.innerHTML="";
  if(!total){
    view.innerHTML='<div class="empty">Nothing in your plan yet.<br>Pick pandals from the list first.'+
      '<br><a href="index.html">Choose pandals</a></div>';return;
  }
  const nextP=mine.find(d=>!done.has(d.n));
if(nextP&&!cat){
    const n=document.createElement("div");
    n.className="next";
    n.innerHTML="Next up: <b>"+esc(nextP.n)+"</b> &middot; "+esc(nextP.l);
    view.appendChild(n);
  }
  const list=mine.filter(d=>(!cat||d.c===cat)&&(!hideDone||!done.has(d.n)));
  if(!list.length){view.innerHTML+='<div class="empty">All done here.</div>';return}
  for(const c of CATS){
    const items=list.filter(d=>d.c===c.k);
    if(!items.length)continue;
    const [bg,fg]=CM[CATS.indexOf(c)];
    const dh=items.filter(i=>done.has(i.n)).length;
    const sec=document.createElement("section");
    sec.className="cat";
    sec.innerHTML='<h2 style="background:'+bg+';color:'+fg+'">'+ICONS[CATS.indexOf(c)]+' '+esc(c.n)+
      '<span class="c">'+dh+'/'+items.length+'</span></h2>';
    const byLoc=new Map();
    for(const i of items){if(!byLoc.has(i.l))byLoc.set(i.l,[]);byLoc.get(i.l).push(i);}
    for(const [loc,arr] of byLoc){
      const t=document.createElement("div");
      t.className="locname";t.textContent=loc;
      sec.appendChild(t);
      for(const i of arr){
        const on=done.has(i.n);
        const c=document.createElement("div");
        c.className="card"+(on?" done":"");
        c.style.borderLeftColor=fg;
        c.innerHTML='<div class="nm">'+esc(i.n)+'</div><div class="ty">'+esc(i.t)+' &#183; '+esc(i.z)+'</div>'+
          '<div class="row"><button class="btn'+(on?" on":"")+'">'+(on?"&#10003; Done":"Mark as done")+'</button>'+
          '<a class="map" href="'+esc(i.m)+'" target="_blank" rel="noopener">Map</a></div>';
        const b=c.querySelector(".btn");
        b.onclick=()=>{done.has(i.n)?done.delete(i.n):done.add(i.n);save();render()};
        sec.appendChild(c);
      }
      const ma=document.createElement("button");
      ma.className="markall";ma.textContent="mark all done in "+loc;
      ma.onclick=()=>{arr.forEach(i=>done.add(i.n));save();render()};
      sec.appendChild(ma);
    }
    view.appendChild(sec);
  }
  const f=document.createElement("div");
  f.className="alpana";f.textContent="❁ ❦ ❁ ❦ ❁";
  view.appendChild(f);
  const ft=document.createElement("footer");
  ft.innerHTML='<div class="joy">জয় দূর্গা মা</div>'+
    'Pandals, maps and categories from thepujo.com · Durga Puja 2026';
  view.appendChild(ft);
}
document.getElementById("reset").onclick=()=>{done.clear();save();render()};
render();
