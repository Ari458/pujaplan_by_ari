<style>
:root{--ink:#2b1d1e;--soft:#7a5c60;--line:#ecdfde;--gold:#d4a017;--gold2:#f6d97a;--maroon:#9B1B30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.5 "Segoe UI",Roboto,system-ui,Arial,sans-serif;color:var(--ink);padding-bottom:40px;
background-color:#fbf2ec;
background-image:radial-gradient(circle,rgba(212,160,23,.14) 1.6px,transparent 1.7px),radial-gradient(circle,rgba(155,27,48,.07) 1.2px,transparent 1.3px);
background-size:28px 28px;background-position:0 0,14px 14px}
.toran{height:15px;background:conic-gradient(from -45deg at 50% 0,#e2542f 0 90deg,#d4a017 0 180deg,#9B1B30 0 270deg,#1e7d3c 0);background-size:24px 15px;box-shadow:0 2px 4px rgba(90,20,20,.25)}
header{background:linear-gradient(135deg,#9B1B30,#5f0d1e);color:#fff;padding:12px 18px 16px;text-align:center;border-bottom:3px solid var(--gold);box-shadow:0 4px 14px rgba(90,15,30,.25);position:relative}
header h1{margin:4px 0 0;font-size:23px;letter-spacing:.4px;text-shadow:0 2px 6px rgba(0,0,0,.35)}
header p{margin:5px 0 0;font-size:13px;letter-spacing:.3px;opacity:.95}
.mandir{color:var(--gold2);font-size:15px;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;gap:8px}
.durga{width:42px;height:42px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.clock{position:absolute;top:9px;right:14px;text-align:right;line-height:1.25;color:var(--gold2)}
.clock b{display:block;font-size:14px;letter-spacing:.5px}
.clock span{font-size:11.5px;opacity:.9}
.clock em{display:block;font-size:11.5px;font-style:normal;color:#ffe9a8;opacity:.95;margin-top:1px}
.bar{position:sticky;top:0;z-index:20;background:#fff;padding:10px 14px 8px;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(120,40,50,.08)}
.search{width:100%;padding:11px 12px;border:1px solid #dcc9c6;border-radius:10px;font-size:15px;background:#fffdfa}
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 0 3px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid #e2d3d4;background:#fff;color:#5c4749;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,#9B1B30,#5f0d1e);border-color:var(--gold);color:#fff;box-shadow:0 0 0 2px rgba(212,160,23,.25)}
.tools{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;min-height:46px;border:0;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer}
.pri{background:linear-gradient(135deg,#c0392b,#7a1024);color:#fff;box-shadow:0 2px 6px rgba(122,16,36,.3)}
.sec{background:linear-gradient(135deg,#f6d97a,#d4a017);color:#4a2c00}
.ghost{background:#f3e8e6;color:#7a2438;flex:0 0 auto;padding:0 16px}
main{max-width:620px;margin:0 auto;padding:14px 12px}
.loc{background:#fff;border:1px solid var(--line);border-left:5px solid var(--maroon);border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 6px rgba(120,40,50,.06)}
.loc>h2{margin:0;padding:11px 13px;background:linear-gradient(90deg,#f6e9e2,#fdf7ef);font-size:15px;display:flex;align-items:center;gap:9px;cursor:pointer;border-bottom:1px solid #f0e0cd}
.loc>h2 .c{margin-left:auto;font-size:12.5px;color:var(--soft);font-weight:600;white-space:nowrap}
.badge{flex:none;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid rgba(0,0,0,.06)}
ul{list-style:none;margin:0;padding:2px 0}
li{display:flex;align-items:center;gap:11px;padding:9px 13px;border-top:1px solid #f7f0ef}
li:first-child{border-top:0}
li label{flex:1;cursor:pointer;font-size:14.5px}
li.sel{background:linear-gradient(90deg,#fff5f3,#fffdfa);box-shadow:inset 3px 0 0 var(--gold)}
li label::after{content:""}
li.sel label{position:relative}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
background:#2b1d1e;color:#fff;padding:11px 14px;border-radius:10px;font-size:13.5px;display:flex;gap:12px;
align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:88%}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:var(--gold2);color:#4a2c00;border:0;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;min-height:34px}
a.map{flex:none;text-decoration:none;font-size:13px;font-weight:700;padding:8px 11px;border-radius:9px;
background:linear-gradient(135deg,#f6d97a,#d4a017);color:#4a2c00;box-shadow:0 1px 3px rgba(120,80,0,.25)}
.alpana{display:flex;align-items:center;justify-content:center;gap:7px;margin:20px 0 4px;color:var(--gold);font-size:13px}
footer{text-align:center;padding:6px 16px 34px;color:var(--soft);font-size:12.5px}
footer .joy{font-size:18px;color:var(--maroon);font-weight:700;letter-spacing:1.5px}
.sticky{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;box-shadow:0 -3px 12px rgba(120,40,50,.1)}
.count{font-weight:700;font-size:14px}
.syncbtn{flex:0 0 auto;min-height:46px;padding:0 13px;border:0;border-radius:10px;cursor:pointer;
background:#f1e6e5;color:#7a2438;font-size:13.5px;font-weight:700}
.syncbtn.good{background:#e4f2e6;color:#1e6b34}
.syncbtn.bad{background:#fde8e4;color:#a3341f}
</style>
</head>

      li.innerHTML='<input type="checkbox"'+(on2?" checked":"")+'>'+
        '<label>'+esc(i.n)+'<span style="color:#8a7072;font-size:12.5px"> &#183; '+esc(i.t)+'</span></label>'+
        '<a class="map" href="'+esc(i.m)+'" target="_blank" rel="noopener">map</a>';
      const cb=li.querySelector("input");
      cb.onchange=()=>{cb.checked?sel.add(i.n):sel.delete(i.n);save();render();
        if(cb.checked)FALL.drop(46);};
      ul.appendChild(li);
    }
    d.appendChild(ul);view.appendChild(d);
  }
  stats.textContent=sel.size+" selected";
}
document.getElementById("selall").onclick=()=>{DATA.forEach(i=>sel.add(i.n));save();render();FALL.drop(90)};
let undo=null;
const toast=(msg,showUndo)=>{const t=document.getElementById("toast");
  t.innerHTML='<span>'+esc(msg)+'</span>'+(showUndo?'<button id="undo">undo</button>':'');
  t.classList.add("show");
  if(showUndo)document.getElementById("undo").onclick=()=>{
    if(undo){sel=new Set(undo);undo=null;save();render();}
    t.classList.remove("show");};
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),4200);};
document.getElementById("none").onclick=()=>{undo=[...sel];sel.clear();save();render();toast("selection cleared",true)};
const go=()=>{save();location.href=SYNC.link("puja_plan.html")+"#s="+encodeURIComponent([...sel].sort().join("|"))};
document.getElementById("go").onclick=go;
document.getElementById("q").addEventListener("input",e=>{q=e.target.value;render()});
render();
SYNC.start();
</script>
</body>
</html>
